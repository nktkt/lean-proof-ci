name: Lean Proof CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: examples/basic
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Install the CLI
        run: python -m pip install .
      - name: Test against real Lean
        run: python -m unittest discover -v
      - name: Check the committed baseline
        run: lean-proof-ci check examples/basic --baseline examples/basic/lean-proof-ci.baseline.json
      - name: Include the audit in the job summary
        if: always()
        shell: bash
        run: |
          if [ -f examples/basic/.proof-ci/report.md ]; then
            cat examples/basic/.proof-ci/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-proof-ci-report
          path: examples/basic/.proof-ci/
          include-hidden-files: true
          if-no-files-found: ignore
