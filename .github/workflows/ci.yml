name: Lean Proof CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: examples/basic
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Install the CLI
        run: python -m pip install .
      - name: Test against real Lean
        run: python -m unittest discover -v
      - name: Audit using the reusable action
        id: audit
        uses: ./
        with:
          project: examples/basic
          baseline: ${{ github.event_name != 'pull_request' && 'examples/basic/lean-proof-ci.baseline.json' || '' }}
          baseline-ref: ${{ github.event.pull_request.base.sha || '' }}
          report-directory: examples/basic/.proof-ci
      - name: Exercise the action's failure path
        id: broken
        continue-on-error: true
        uses: ./
        with:
          project: examples/broken
          report-directory: examples/broken/.proof-ci
      - name: Verify the intentional failure
        shell: bash
        env:
          PROOF_CI_EXIT: ${{ steps.broken.outputs.exit-code }}
          PROOF_CI_STATUS: ${{ steps.broken.outputs.status }}
        run: |
          if [ "$PROOF_CI_EXIT" != '1' ] || [ "$PROOF_CI_STATUS" != 'fail' ]; then
            echo 'The broken example must produce an audit failure (exit 1).' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-proof-ci-report
          path: |
            examples/basic/.proof-ci/
            examples/broken/.proof-ci/
          include-hidden-files: true
          if-no-files-found: ignore
